<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Zombies R US</title>
<style>
body{margin:0;background:#101010;color:white;font-family:monospace;text-align:center;overflow:hidden;touch-action:none}
h1{font-size:26px;margin:8px;color:#ffd84a;text-shadow:3px 3px #000}
canvas{image-rendering:pixelated;background:#2f7d32;border:6px solid #ffd84a;width:96vw;height:62vh}
#hud{font-size:16px;margin:4px;color:#fff}
#controls{position:fixed;bottom:18px;width:100%;display:flex;justify-content:space-around;align-items:center}
#stick{width:130px;height:130px;border-radius:50%;background:#333;border:4px solid #ffd84a;position:relative}
#knob{width:50px;height:50px;border-radius:50%;background:#ffd84a;position:absolute;left:40px;top:40px}
#attack{width:120px;height:120px;border-radius:50%;background:#b82020;color:white;font-size:22px;border:5px solid #ffd84a}
button{font-family:monospace}
</style>
</head>
<body>

<h1>🧟 Zombies R US 🍗🐉</h1>
<div id="hud">Tap START</div>
<canvas id="game" width="320" height="220"></canvas>

<div id="controls">
  <div id="stick"><div id="knob"></div></div>
  <button id="start">START</button>
  <button id="attack">ATTACK</button>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const hud=document.getElementById("hud");
const stick=document.getElementById("stick");
const knob=document.getElementById("knob");

let joyX=0, joyY=0, playing=false;
let player, dragon, chickens=[], zombies=[], fireballs=[];
let score=0;

function reset(){
  player={x:35,y:110,w:14,h:18,hp:100,chicken:0,cool:0};
  dragon={x:265,y:85,w:34,h:34,hp:120,cool:0};
  chickens=[]; zombies=[]; fireballs=[]; score=0; playing=true;
  for(let i=0;i<10;i++) chickens.push({x:50+Math.random()*180,y:35+Math.random()*140,w:10,h:10});
  for(let i=0;i<5;i++) zombies.push({x:90+Math.random()*130,y:30+Math.random()*150,w:14,h:18,s:.45,cool:0});
}

document.getElementById("start").onclick=reset;
document.getElementById("attack").onclick=attack;

function attack(){
  if(!playing||player.chicken<=0||player.cool>0)return;
  let d=Math.hypot(player.x-dragon.x,player.y-dragon.y);
  if(d<55){
    player.chicken--;
    player.cool=25;
    dragon.hp-=20;
    score+=25;
    if(dragon.hp<=0){playing=false;hud.innerHTML="🏆 YOU BEAT THE DRAGON!";}
  }
}

function hit(a,b){
  return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
}

function joystick(e){
  e.preventDefault();
  let t=e.touches[0];
  let r=stick.getBoundingClientRect();
  let cx=r.left+r.width/2, cy=r.top+r.height/2;
  let dx=t.clientX-cx, dy=t.clientY-cy;
  let dist=Math.min(45,Math.hypot(dx,dy));
  let ang=Math.atan2(dy,dx);
  joyX=Math.cos(ang)*(dist/45);
  joyY=Math.sin(ang)*(dist/45);
  knob.style.left=(40+joyX*40)+"px";
  knob.style.top=(40+joyY*40)+"px";
}
stick.addEventListener("touchstart",joystick,{passive:false});
stick.addEventListener("touchmove",joystick,{passive:false});
stick.addEventListener("touchend",e=>{
  joyX=0;joyY=0;knob.style.left="40px";knob.style.top="40px";
},{passive:false});

function update(){
  if(!playing)return;
  if(player.cool>0)player.cool--;
  if(dragon.cool>0)dragon.cool--;

  player.x+=joyX*2.1;
  player.y+=joyY*2.1;
  player.x=Math.max(4,Math.min(302,player.x));
  player.y=Math.max(24,Math.min(198,player.y));

  chickens=chickens.filter(c=>{
    if(hit(player,c)){player.chicken++;score+=10;return false;}
    return true;
  });

  zombies.forEach(z=>{
    let a=Math.atan2(player.y-z.y,player.x-z.x);
    z.x+=Math.cos(a)*z.s;
    z.y+=Math.sin(a)*z.s;
    if(z.cool>0)z.cool--;
    if(hit(player,z)&&z.cool<=0){player.hp-=8;z.cool=35;}
  });

  if(dragon.cool<=0){
    let a=Math.atan2(player.y-dragon.y,player.x-dragon.x);
    fireballs.push({x:dragon.x,y:dragon.y,w:8,h:8,vx:Math.cos(a)*1.8,vy:Math.sin(a)*1.8,life:90});
    dragon.cool=70;
  }

  fireballs=fireballs.filter(f=>{
    f.x+=f.vx;f.y+=f.vy;f.life--;
    if(hit(player,f)){player.hp-=12;return false;}
    return f.life>0;
  });

  if(player.hp<=0){playing=false;hud.innerHTML="💀 GAME OVER";}
  else hud.innerHTML=`❤️ ${Math.floor(player.hp)} | 🍗 ${player.chicken} | 🐉 ${Math.max(0,dragon.hp)} | ⭐ ${score}`;
}

function drawPixelPerson(x,y,shirt,skin){
  ctx.fillStyle=skin;ctx.fillRect(x+4,y,6,5);
  ctx.fillStyle="#111";ctx.fillRect(x+3,y+1,8,2);
  ctx.fillStyle=shirt;ctx.fillRect(x+2,y+6,10,8);
  ctx.fillStyle="#333";ctx.fillRect(x+1,y+14,4,5);ctx.fillRect(x+9,y+14,4,5);
  ctx.fillStyle="#222";ctx.fillRect(x,y+7,3,6);ctx.fillRect(x+11,y+7,3,6);
}

function drawChicken(x,y){
  ctx.fillStyle="#d9822b";ctx.fillRect(x+2,y+2,7,5);
  ctx.fillStyle="#f6c36a";ctx.fillRect(x+7,y,3,3);
  ctx.fillStyle="#eee";ctx.fillRect(x,y+4,3,2);
}

function drawDragon(x,y){
  ctx.fillStyle="#8b1111";ctx.fillRect(x,y+10,28,16);
  ctx.fillStyle="#b82020";ctx.fillRect(x+18,y,14,14);
  ctx.fillStyle="#ffd84a";ctx.fillRect(x+29,y+4,4,3);
  ctx.fillStyle="#5b0b0b";ctx.fillRect(x+4,y+24,6,8);ctx.fillRect(x+20,y+24,6,8);
}

function draw(){
  ctx.clearRect(0,0,320,220);

  for(let y=0;y<220;y+=16)for(let x=0;x<320;x+=16){
    ctx.fillStyle=((x+y)/16)%2==0?"#2f7d32":"#2b7030";
    ctx.fillRect(x,y,16,16);
  }

  ctx.fillStyle="#1d4f24";
  for(let i=0;i<20;i++)ctx.fillRect((i*47)%320,20+(i*31)%180,8,12);

  chickens.forEach(c=>drawChicken(c.x,c.y));
  fireballs.forEach(f=>{ctx.fillStyle="#ff6a00";ctx.fillRect(f.x,f.y,8,8)});
  zombies.forEach(z=>drawPixelPerson(z.x,z.y,"#3f7f3f","#9fd18b"));
  drawDragon(dragon.x,dragon.y);
  drawPixelPerson(player.x,player.y,"#3aa6ff","#b9d7b1");

  if(!playing){
    ctx.fillStyle="rgba(0,0,0,.65)";
    ctx.fillRect(30,60,260,90);
    ctx.fillStyle="#ffd84a";
    ctx.font="18px monospace";
    ctx.fillText("ZOMBIES R US",88,95);
    ctx.fillStyle="#fff";
    ctx.font="12px monospace";
    ctx.fillText("Tap START to play",95,122);
  }
}

function loop(){update();draw();requestAnimationFrame(loop)}
loop();
</script>
</body>
</html>
