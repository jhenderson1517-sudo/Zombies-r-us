<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Zombies R US 3D</title>
<style>
body{margin:0;overflow:hidden;background:#000;font-family:Arial;color:white;touch-action:none}
#hud{position:fixed;top:10px;left:0;width:100%;text-align:center;z-index:10;font-weight:bold;text-shadow:2px 2px #000}
#ui{position:fixed;bottom:18px;width:100%;display:flex;justify-content:space-around;align-items:center;z-index:10}
#joy{width:145px;height:145px;border-radius:50%;background:rgba(50,50,50,.7);border:5px solid #ffd84a;position:relative}
#knob{width:58px;height:58px;border-radius:50%;background:#ffd84a;position:absolute;left:43px;top:43px}
button{font-size:22px;font-weight:bold;border-radius:20px;border:4px solid #ffd84a;background:#c51f1f;color:white;padding:20px}
</style>
</head>
<body>

<div id="hud">🧟 Zombies R US 64 🍗🐉<br><span id="stats">Loading...</span></div>

<div id="ui">
  <div id="joy"><div id="knob"></div></div>
  <button onclick="newGame()">START</button>
  <button id="attack">⚔️ ATTACK</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>

<script>
let scene,camera,renderer,player,dragon,sword;
let zombies=[],chickens=[],trees=[],fireballs=[];
let joyX=0,joyY=0,health=100,chicken=0,dragonHP=200,score=0,playing=false;
const stats=document.getElementById("stats");
const joy=document.getElementById("joy");
const knob=document.getElementById("knob");

init();
newGame();
animate();

function init(){
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x6bb7ff);
 scene.fog=new THREE.Fog(0x6bb7ff,20,85);

 camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,1000);
 renderer=new THREE.WebGLRenderer({antialias:false});
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(1);
 document.body.appendChild(renderer.domElement);

 const sun=new THREE.DirectionalLight(0xffffff,1.2);
 sun.position.set(10,20,8);
 scene.add(sun);
 scene.add(new THREE.AmbientLight(0x777777));

 const ground=new THREE.Mesh(
  new THREE.PlaneGeometry(120,120,16,16),
  new THREE.MeshLambertMaterial({color:0x2f8f3a})
 );
 ground.rotation.x=-Math.PI/2;
 scene.add(ground);

 for(let i=0;i<35;i++) makeTree(Math.random()*100-50,Math.random()*100-50);
}

function box(w,h,d,color){
 return new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  new THREE.MeshLambertMaterial({color})
 );
}

function sphere(r,color){
 return new THREE.Mesh(
  new THREE.SphereGeometry(r,8,8),
  new THREE.MeshLambertMaterial({color})
 );
}

function groupPlayer(x,z){
 const g=new THREE.Group();
 const body=box(1,.9,.6,0x33aaff); body.position.y=1.15; g.add(body);
 const head=sphere(.38,0xb7e5b2); head.position.y=1.9; g.add(head);
 const hat=box(.9,.2,.75,0x143d22); hat.position.y=2.25; g.add(hat);
 const l1=box(.25,.7,.25,0x222244); l1.position.set(-.28,.45,0); g.add(l1);
 const l2=box(.25,.7,.25,0x222244); l2.position.set(.28,.45,0); g.add(l2);
 sword=box(.12,1.5,.12,0xdedede); sword.position.set(.8,1.3,-.3); sword.rotation.z=.8; g.add(sword);
 g.position.set(x,0,z);
 scene.add(g);
 return g;
}

function groupZombie(x,z){
 const g=new THREE.Group();
 const body=box(1,.9,.6,0x3f8f44); body.position.y=1.05; g.add(body);
 const head=sphere(.35,0x8fd47a); head.position.y=1.75; g.add(head);
 const arm1=box(.25,.75,.25,0x6fbf62); arm1.position.set(-.7,1.1,-.2); arm1.rotation.z=.7; g.add(arm1);
 const arm2=box(.25,.75,.25,0x6fbf62); arm2.position.set(.7,1.1,-.2); arm2.rotation.z=-.7; g.add(arm2);
 const leg1=box(.25,.65,.25,0x254422); leg1.position.set(-.25,.35,0); g.add(leg1);
 const leg2=box(.25,.65,.25,0x254422); leg2.position.set(.25,.35,0); g.add(leg2);
 g.position.set(x,0,z);
 scene.add(g);
 return g;
}

function makeDragon(x,z){
 const g=new THREE.Group();
 const body=box(3,1.5,2,0x991818); body.position.y=1.3; g.add(body);
 const head=box(1.6,1.2,1.4,0xc02020); head.position.set(2.2,1.7,0); g.add(head);
 const wing1=box(.2,1.8,2.5,0x6e1111); wing1.position.set(-.7,2,.9); wing1.rotation.z=.7; g.add(wing1);
 const wing2=box(.2,1.8,2.5,0x6e1111); wing2.position.set(-.7,2,-.9); wing2.rotation.z=.7; g.add(wing2);
 const horn1=box(.2,.7,.2,0xffd84a); horn1.position.set(2.4,2.55,.35); g.add(horn1);
 const horn2=box(.2,.7,.2,0xffd84a); horn2.position.set(2.4,2.55,-.35); g.add(horn2);
 g.position.set(x,0,z);
 scene.add(g);
 return g;
}

function makeChicken(x,z){
 const g=new THREE.Group();
 const meat=sphere(.35,0xd9822b); meat.scale.set(1.3,.8,.8); meat.position.y=.45; g.add(meat);
 const bone=box(.5,.15,.15,0xffffff); bone.position.set(-.45,.45,0); g.add(bone);
 g.position.set(x,0,z);
 scene.add(g);
 return g;
}

function makeTree(x,z){
 const trunk=box(.7,2,.7,0x6b3f1d); trunk.position.set(x,1,z); scene.add(trunk);
 const leaves=sphere(1.6,0x116b2f); leaves.scale.set(1,1.3,1); leaves.position.set(x,3,z); scene.add(leaves);
 trees.push(trunk,leaves);
}

function newGame(){
 zombies.forEach(o=>scene.remove(o));
 chickens.forEach(o=>scene.remove(o));
 fireballs.forEach(o=>scene.remove(o));
 if(player)scene.remove(player);
 if(dragon)scene.remove(dragon);

 zombies=[]; chickens=[]; fireballs=[];
 health=100; chicken=0; dragonHP=200; score=0; playing=true;

 player=groupPlayer(-18,0);
 dragon=makeDragon(25,0);

 for(let i=0;i<12;i++) chickens.push(makeChicken(Math.random()*35-15,Math.random()*35-17));
 for(let i=0;i<8;i++) zombies.push(groupZombie(Math.random()*35-5,Math.random()*35-17));
}

function attack(){
 if(!playing)return;
 sword.rotation.z=-1.2;
 setTimeout(()=>sword.rotation.z=.8,120);

 zombies=zombies.filter(z=>{
  if(player.position.distanceTo(z.position)<3){
   scene.remove(z); score+=25; return false;
  }
  return true;
 });

 if(player.position.distanceTo(dragon.position)<5){
  dragonHP-=20; score+=50;
  dragon.scale.setScalar(1+Math.max(0,dragonHP)/400);
  if(dragonHP<=0){playing=false;stats.innerText="🏆 Dragon defeated!";}
 }
}
document.getElementById("attack").addEventListener("touchstart",e=>{e.preventDefault();attack()},{passive:false});
document.getElementById("attack").addEventListener("click",attack);

function joystick(e){
 e.preventDefault();
 const t=e.touches[0],r=joy.getBoundingClientRect();
 const cx=r.left+r.width/2,cy=r.top+r.height/2;
 let dx=t.clientX-cx,dy=t.clientY-cy;
 let dist=Math.min(48,Math.hypot(dx,dy));
 let ang=Math.atan2(dy,dx);
 joyX=Math.cos(ang)*(dist/48);
 joyY=Math.sin(ang)*(dist/48);
 knob.style.left=(43+joyX*43)+"px";
 knob.style.top=(43+joyY*43)+"px";
}
joy.addEventListener("touchstart",joystick,{passive:false});
joy.addEventListener("touchmove",joystick,{passive:false});
joy.addEventListener("touchend",()=>{joyX=0;joyY=0;knob.style.left="43px";knob.style.top="43px"},{passive:false});

function update(){
 if(!playing)return;

 player.position.x+=joyX*.22;
 player.position.z+=joyY*.22;

 if(Math.abs(joyX)+Math.abs(joyY)>.1){
  player.rotation.y=Math.atan2(joyX,joyY);
 }

 chickens=chickens.filter(c=>{
  if(player.position.distanceTo(c.position)<1.5){
   scene.remove(c); chicken++; score+=10; return false;
  }
  return true;
 });

 zombies.forEach(z=>{
  const dir=new THREE.Vector3().subVectors(player.position,z.position).normalize();
  z.position.add(dir.multiplyScalar(.045));
  z.lookAt(player.position);
  if(player.position.distanceTo(z.position)<1.3) health-=.12;
 });

 if(Math.random()<.018){
  const f=sphere(.25,0xff6600);
  f.position.copy(dragon.position);
  f.position.y=1.5;
  const dir=new THREE.Vector3().subVectors(player.position,dragon.position).normalize();
  f.userData={vx:dir.x*.25,vz:dir.z*.25,life:120};
  scene.add(f); fireballs.push(f);
 }

 fireballs=fireballs.filter(f=>{
  f.position.x+=f.userData.vx;
  f.position.z+=f.userData.vz;
  f.userData.life--;
  if(player.position.distanceTo(f.position)<1){
   health-=8; scene.remove(f); return false;
  }
  if(f.userData.life<=0){scene.remove(f); return false;}
  return true;
 });

 if(health<=0){playing=false;stats.innerText="💀 Game Over";}

 stats.innerText=`❤️ ${Math.floor(health)} | 🍗 ${chicken} | 🐉 ${Math.max(0,dragonHP)} | ⭐ ${score}`;

 camera.position.x=player.position.x;
 camera.position.z=player.position.z+12;
 camera.position.y=8;
 camera.lookAt(player.position.x,1,player.position.z);
}

function animate(){
 requestAnimationFrame(animate);
 update();
 renderer.render(scene,camera);
}

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
