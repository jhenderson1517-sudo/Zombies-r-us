<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zombies R US</title>
<style>
body{margin:0;background:#111;color:white;font-family:Arial;text-align:center;overflow:hidden}
h1{font-size:28px;margin:10px}
canvas{background:#275c32;border:4px solid #f5c542;border-radius:12px;width:96vw;height:62vh}
button{font-size:22px;padding:18px;margin:6px;border-radius:12px;border:none;background:#f5c542}
#controls{position:fixed;bottom:10px;width:100%}
</style>
</head>
<body>

<h1>🧟 Zombies R US 🍗🐉</h1>
<canvas id="game" width="800" height="500"></canvas>

<div id="controls">
  <div>
    <button ontouchstart="up=true" ontouchend="up=false">⬆️</button>
  </div>
  <button ontouchstart="left=true" ontouchend="left=false">⬅️</button>
  <button onclick="startGame()">START</button>
  <button ontouchstart="right=true" ontouchend="right=false">➡️</button>
  <div>
    <button ontouchstart="down=true" ontouchend="down=false">⬇️</button>
    <button onclick="attack()">🍗 ATTACK</button>
  </div>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let player={x:60,y:250,size:35,health:100,chicken:0};
let dragon={x:680,y:220,size:70,health:100};
let chickens=[];
let zombies=[];
let up=false,down=false,left=false,right=false;
let playing=false;
let message="Tap START";

function startGame(){
  player={x:60,y:250,size:35,health:100,chicken:0};
  dragon={x:680,y:220,size:70,health:100};
  chickens=[];
  zombies=[];
  message="";
  playing=true;

  for(let i=0;i<10;i++){
    chickens.push({x:100+Math.random()*520,y:60+Math.random()*360,size:25});
  }

  for(let i=0;i<5;i++){
    zombies.push({x:220+Math.random()*350,y:60+Math.random()*360,size:35,speed:1});
  }
}

function touch(a,b){
  return a.x<a.x+a.size&&a.x<b.x+b.size&&a.x+a.size>b.x&&a.y<b.y+b.size&&a.y+a.size>b.y;
}

function attack(){
  if(!playing)return;
  let dx=player.x-dragon.x;
  let dy=player.y-dragon.y;
  let dist=Math.sqrt(dx*dx+dy*dy);

  if(player.chicken>0 && dist<150){
    player.chicken--;
    dragon.health-=15;
    if(dragon.health<=0){
      playing=false;
      message="🏆 You defeated the dragon!";
    }
  }
}

function update(){
  if(!playing)return;

  if(up)player.y-=4;
  if(down)player.y+=4;
  if(left)player.x-=4;
  if(right)player.x+=4;

  player.x=Math.max(0,Math.min(765,player.x));
  player.y=Math.max(45,Math.min(465,player.y));

  chickens=chickens.filter(c=>{
    if(touch(player,c)){
      player.chicken++;
      return false;
    }
    return true;
  });

  zombies.forEach(z=>{
    let angle=Math.atan2(player.y-z.y,player.x-z.x);
    z.x+=Math.cos(angle)*z.speed;
    z.y+=Math.sin(angle)*z.speed;

    if(touch(player,z)){
      player.health-=0.4;
    }
  });

  if(player.health<=0){
    playing=false;
    message="💀 Game Over";
  }
}

function draw(){
  ctx.clearRect(0,0,800,500);

  ctx.font="28px Arial";
  ctx.fillText("🌲",120,90);
  ctx.fillText("🌲",300,160);
  ctx.fillText("🌲",500,100);
  ctx.fillText("🌲",650,390);

  chickens.forEach(c=>ctx.fillText("🍗",c.x,c.y));
  zombies.forEach(z=>ctx.fillText("🧟‍♂️",z.x,z.y));

  ctx.font="60px Arial";
  ctx.fillText("🐉",dragon.x,dragon.y);

  ctx.font="34px Arial";
  ctx.fillText("🧟",player.x,player.y);

  ctx.font="18px Arial";
  ctx.fillStyle="white";
  ctx.fillText("Health: "+Math.floor
