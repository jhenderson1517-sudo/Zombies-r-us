<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Zombies R US 3D</title>
<style>
body{margin:0;overflow:hidden;background:#000;font-family:Arial;color:white;text-align:center}
#hud{position:fixed;top:10px;left:0;width:100%;z-index:5;font-size:18px}
#controls{position:fixed;bottom:15px;width:100%;z-index:5}
button{font-size:24px;padding:18px;margin:6px;border-radius:14px;border:0;background:#f5c542}
#attack{background:#ff6b35}
</style>
</head>
<body>

<div id="hud">🧟 Zombies R US 3D 🍗🐉<br><span id="stats">Tap START</span></div>

<div id="controls">
  <div><button ontouchstart="up=true" ontouchend="up=false">⬆️</button></div>
  <button ontouchstart="left=true" ontouchend="left=false">⬅️</button>
  <button onclick="startGame()">START</button>
  <button ontouchstart="right=true" ontouchend="right=false">➡️</button>
  <div>
    <button ontouchstart="down=true" ontouchend="down=false">⬇️</button>
    <button id="attack" onclick="attack()">🍗 ATTACK</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>

<script>
let scene,camera,renderer,player,dragon;
let chickens=[],zombies=[];
let health=100,chicken=0,dragonHealth=100;
let up=false,down=false,left=false,right=false,playing=false;

init();

function init(){
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x102515);

  camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,1000);
  camera.position.set(0,8,12);
  camera.lookAt(0,0,0);

  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth,innerHeight);
  document.body.appendChild(renderer.domElement);

  const light=new THREE.DirectionalLight(0xffffff,1);
  light.position.set(5,10,5);
  scene.add(light);
  scene.add(new THREE.AmbientLight(0x888888));

  const ground=new THREE.Mesh(
    new THREE.PlaneGeometry(40,40),
    new THREE.MeshStandardMaterial({color:0x225522})
  );
  ground.rotation.x=-Math.PI/2;
  scene.add(ground);

  animate();
}

function makeBox(color,x,z,size=1){
  const obj=new THREE.Mesh(
    new THREE.BoxGeometry(size,size,size),
    new THREE.MeshStandardMaterial({color})
  );
  obj.position.set(x,size/2,z);
  scene.add(obj);
  return obj;
}

function startGame(){
  chickens.forEach(o=>scene.remove(o));
  zombies.forEach(o=>scene.remove(o));
  if(player)scene.remove(player);
  if(dragon)scene.remove(dragon);

  chickens=[]; zombies=[];
  health=100; chicken=0; dragonHealth=100; playing=true;

  player=makeBox(0x44ff44,-8,0,1);
  dragon=makeBox(0xff3333,8,0,2);

  for(let i=0;i<10;i++){
    chickens.push(makeBox(0xffcc33,Math.random()*14-7,Math.random()*14-7,.5));
  }

  for(let i=0;i<5;i++){
    zombies.push(makeBox(0x66aa66,Math.random()*10-5,Math.random()*10-5,1));
  }
}

function attack(){
  if(!playing||chicken<=0)return;
  let d=player.position.distanceTo(dragon.position);
  if(d<4){
    chicken--;
    dragonHealth-=20;
    dragon.scale.set(1+.02*dragonHealth,1+.02*dragonHealth,1+.02*dragonHealth);
    if(dragonHealth<=0){
      playing=false;
      document.getElementById("stats").innerText="🏆 You defeated the dragon!";
    }
  }
}

function update(){
  if(!playing)return;

  if(up)player.position.z-=.15;
  if(down)player.position.z+=.15;
  if(left)player.position.x-=.15;
  if(right)player.position.x+=.15;

  chickens=chickens.filter(c=>{
    if(player.position.distanceTo(c.position)<1){
      scene.remove(c);
      chicken++;
      return false;
    }
    return true;
  });

  zombies.forEach(z=>{
    let dir=new THREE.Vector3().subVectors(player.position,z.position).normalize();
    z.position.add(dir.multiplyScalar(.035));
    if(player.position.distanceTo(z.position)<1){
      health-=.15;
    }
  });

  if(health<=0){
    playing=false;
    document.getElementById("stats").innerText="💀 Game Over";
  }else{
    document.getElementById("stats").innerText=
      "❤️ Health: "+Math.floor(health)+" | 🍗 Chicken: "+chicken+" | 🐉 Dragon: "+Math.max(0,dragonHealth);
  }

  camera.position.x=player.position.x;
  camera.position.z=player.position.z+12;
  camera.lookAt(player.position);
}

function animate(){
  requestAnimationFrame(animate);
  update();
  renderer.render(scene,camera);
}

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
