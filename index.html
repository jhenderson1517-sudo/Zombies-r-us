<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Zombies R US 64</title>
<style>
body{margin:0;overflow:hidden;background:#000;color:white;font-family:Arial;touch-action:none}
#hud{position:fixed;top:10px;width:100%;text-align:center;z-index:5;font-weight:bold;text-shadow:2px 2px 4px #000}
#ui{position:fixed;bottom:18px;width:100%;display:flex;justify-content:space-around;align-items:center;z-index:5}
#joy{width:150px;height:150px;border-radius:50%;background:rgba(0,0,0,.5);border:5px solid #ffd84a;position:relative}
#knob{width:60px;height:60px;border-radius:50%;background:#ffd84a;position:absolute;left:45px;top:45px}
button{font-size:22px;font-weight:bold;border-radius:22px;border:4px solid #ffd84a;background:#b91c1c;color:white;padding:22px}
</style>
</head>
<body>

<div id="hud">🧟 Zombies R US 64 🍗🐉<br><span id="stats">Loading...</span></div>

<div id="ui">
  <div id="joy"><div id="knob"></div></div>
  <button onclick="newGame()">START</button>
  <button id="attack">⚔️ ATTACK</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>

<script>
let scene,camera,renderer,player,dragon,sword;
let zombies=[],chickens=[],fireballs=[];
let joyX=0,joyY=0,health=100,chicken=0,dragonHP=300,score=0,playing=false,swing=0;
const stats=document.getElementById("stats"),joy=document.getElementById("joy"),knob=document.getElementById("knob");

init();newGame();animate();

function init(){
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x87c9ff);
 scene.fog=new THREE.Fog(0x87c9ff,30,100);

 camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,1000);

 renderer=new THREE.WebGLRenderer({antialias:true});
 renderer.setSize(innerWidth,innerHeight);
 renderer.shadowMap.enabled=true;
 document.body.appendChild(renderer.domElement);

 scene.add(new THREE.AmbientLight(0xffffff,.55));

 const sun=new THREE.DirectionalLight(0xffffff,1.4);
 sun.position.set(15,30,10);
 sun.castShadow=true;
 scene.add(sun);

 const ground=new THREE.Mesh(
  new THREE.PlaneGeometry(150,150),
  new THREE.MeshStandardMaterial({color:0x2f8f3a,roughness:.9})
 );
 ground.rotation.x=-Math.PI/2;
 ground.receiveShadow=true;
 scene.add(ground);

 for(let i=0;i<65;i++) makeTree(rand(-70,70),rand(-70,70));
 for(let i=0;i<30;i++) makeRock(rand(-65,65),rand(-65,65));
}

function rand(a,b){return a+Math.random()*(b-a)}
function mat(c){return new THREE.MeshStandardMaterial({color:c,roughness:.75})}
function sphere(r,c){let m=new THREE.Mesh(new THREE.SphereGeometry(r,18,14),mat(c));m.castShadow=true;m.receiveShadow=true;return m}
function cyl(r,h,c){let m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,18),mat(c));m.castShadow=true;m.receiveShadow=true;return m}
function cone(r,h,c){let m=new THREE.Mesh(new THREE.ConeGeometry(r,h,18),mat(c));m.castShadow=true;m.receiveShadow=true;return m}
function box(w,h,d,c){let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.castShadow=true;m.receiveShadow=true;return m}

function makePlayer(x,z){
 const g=new THREE.Group();

 let body=sphere(.58,0x29a3ff);body.scale.set(.85,1.3,.55);body.position.y=1.15;g.add(body);
 let head=sphere(.42,0xbbe8b6);head.position.y=2.08;g.add(head);
 let hat=cyl(.48,.2,0x123d22);hat.position.y=2.48;g.add(hat);

 let eye1=sphere(.045,0x000000);eye1.position.set(-.14,2.15,.34);g.add(eye1);
 let eye2=sphere(.045,0x000000);eye2.position.set(.14,2.15,.34);g.add(eye2);

 let armL=cyl(.14,.9,0xbbe8b6);armL.position.set(-.62,1.2,.05);armL.rotation.z=.4;g.add(armL);
 let armR=cyl(.14,.9,0xbbe8b6);armR.position.set(.62,1.2,.05);armR.rotation.z=-.4;g.add(armR);

 let legL=cyl(.17,.85,0x202044);legL.position.set(-.27,.42,0);g.add(legL);
 let legR=cyl(.17,.85,0x202044);legR.position.set(.27,.42,0);g.add(legR);

 sword=cyl(.06,1.8,0xdedede);sword.position.set(.95,1.35,-.35);sword.rotation.z=.8;g.add(sword);
 let hilt=cyl(.09,.45,0xffd84a);hilt.position.set(.63,1.0,-.15);hilt.rotation.z=1.5;g.add(hilt);

 g.position.set(x,0,z);scene.add(g);return g;
}

function makeZombie(x,z){
 const g=new THREE.Group();
 let body=sphere(.55,0x3f8f44);body.scale.set(.82,1.2,.55);body.position.y=1.05;g.add(body);
 let head=sphere(.38,0x8fd47a);head.position.y=1.9;g.add(head);
 let eye1=sphere(.045,0x000000);eye1.position.set(-.13,1.96,.32);g.add(eye1);
 let eye2=sphere(.045,0x000000);eye2.position.set(.13,1.96,.32);g.add(eye2);
 let armL=cyl(.13,.95,0x78bd6b);armL.position.set(-.75,1.2,.2);armL.rotation.z=.95;g.add(armL);
 let armR=cyl(.13,.95,0x78bd6b);armR.position.set(.75,1.2,.2);armR.rotation.z=-.95;g.add(armR);
 let legL=cyl(.15,.75,0x244422);legL.position.set(-.25,.38,0);g.add(legL);
 let legR=cyl(.15,.75,0x244422);legR.position.set(.25,.38,0);g.add(legR);
 g.position.set(x,0,z);scene.add(g);return g;
}

function makeChicken(x,z){
 const g=new THREE.Group();
 let meat=sphere(.42,0xc86f21);meat.scale.set(1.35,.8,.85);meat.position.set(.15,.48,0);g.add(meat);
 let skin=sphere(.28,0xf5b14c);skin.scale.set(1.1,.7,.7);skin.position.set(.55,.62,0);g.add(skin);
 let bone=cyl(.09,.75,0xffffff);bone.rotation.z=1.57;bone.position.set(-.45,.45,0);g.add(bone);
 let nub=sphere(.15,0xffffff);nub.position.set(-.86,.45,0);g.add(nub);
 g.position.set(x,0,z);scene.add(g);return g;
}

function makeDragon(x,z){
 const g=new THREE.Group();
 let body=sphere(1.25,0x9b1717);body.scale.set(1.7,.9,1);body.position.y=1.25;g.add(body);
 let head=sphere(.85,0xc32727);head.scale.set(1.15,.9,.9);head.position.set(2.25,1.75,0);g.add(head);
 let neck=cyl(.45,1.4,0x8e1515);neck.rotation.z=1.2;neck.position.set(1.35,1.45,0);g.add(neck);
 let wing1=cone(1.0,2.2,0x6e1111);wing1.position.set(-.5,2.1,1.1);wing1.rotation.z=.75;g.add(wing1);
 let wing2=cone(1.0,2.2,0x6e1111);wing2.position.set(-.5,2.1,-1.1);wing2.rotation.z=.75;g.add(wing2);
 let tail=cone(.45,2.7,0x7c1010);tail.rotation.z=-1.35;tail.position.set(-2.1,1.0,0);g.add(tail);
 let horn1=cone(.16,.75,0xffd84a);horn1.position.set(2.45,2.45,.35);g.add(horn1);
 let horn2=cone(.16,.75,0xffd84a);horn2.position.set(2.45,2.45,-.35);g.add(horn2);
 g.position.set(x,0,z);scene.add(g);return g;
}

function makeTree(x,z){
 let trunk=cyl(.35,2.2,0x6b3f1d);trunk.position.set(x,1.1,z);scene.add(trunk);
 let top1=cone(1.5,3.0,0x126b2d);top1.position.set(x,3.1,z);scene.add(top1);
 let top2=cone(1.2,2.4,0x18843a);top2.position.set(x,4.0,z);scene.add(top2);
}

function makeRock(x,z){
 let r=sphere(rand(.25,.65),0x777777);r.scale.set(1.4,.55,1);r.position.set(x,.22,z);scene.add(r);
}

function newGame(){
 zombies.forEach(o=>scene.remove(o));chickens.forEach(o=>scene.remove(o));fireballs.forEach(o=>scene.remove(o));
 if(player)scene.remove(player);if(dragon)scene.remove(dragon);
 zombies=[];chickens=[];fireballs=[];
 health=100;chicken=0;dragonHP=300;score=0;playing=true;swing=0;
 player=makePlayer(-20,0);dragon=makeDragon(28,0);
 for(let i=0;i<14;i++)chickens.push(makeChicken(rand(-18,18),rand(-22,22)));
 for(let i=0;i<10;i++)zombies.push(makeZombie(rand(-6,24),rand(-24,24)));
}

function attack(){
 if(!playing)return;
 swing=12;
 zombies=zombies.filter(z=>{
  if(player.position.distanceTo(z.position)<3.3){scene.remove(z);score+=30;return false}
  return true;
 });
 if(player.position.distanceTo(dragon.position)<5.8){
  dragonHP-=22;score+=55;
  dragon.scale.setScalar(1+Math.max(0,dragonHP)/900);
  if(dragonHP<=0){playing=false;stats.innerText="🏆 Dragon defeated!"}
 }
}
document.getElementById("attack").addEventListener("touchstart",e=>{e.preventDefault();attack()},{passive:false});
document.getElementById("attack").addEventListener("click",attack);

function joystick(e){
 e.preventDefault();
 const t=e.touches[0],r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 let dx=t.clientX-cx,dy=t.clientY-cy,dist=Math.min(50,Math.hypot(dx,dy)),ang=Math.atan2(dy,dx);
 joyX=Math.cos(ang)*(dist/50);joyY=Math.sin(ang)*(dist/50);
 knob.style.left=(45+joyX*45)+"px";knob.style.top=(45+joyY*45)+"px";
}
joy.addEventListener("touchstart",joystick,{passive:false});
joy.addEventListener("touchmove",joystick,{passive:false});
joy.addEventListener("touchend",()=>{joyX=0;joyY=0;knob.style.left="45px";knob.style.top="45px"},{passive:false});

function update(){
 if(!playing)return;

 player.position.x+=joyX*.24;player.position.z+=joyY*.24;
 if(Math.abs(joyX)+Math.abs(joyY)>.1)player.rotation.y=Math.atan2(joyX,joyY);

 if(swing>0){swing--;sword.rotation.z=-1.2+swing*.15}else sword.rotation.z=.8;

 chickens=chickens.filter(c=>{
  if(player.position.distanceTo(c.position)<1.5){scene.remove(c);chicken++;score+=10;return false}
  return true;
 });

 zombies.forEach(z=>{
  const dir=new THREE.Vector3().subVectors(player.position,z.position).normalize();
  z.position.add(dir.multiplyScalar(.05));
  z.lookAt(player.position);
  if(player.position.distanceTo(z.position)<1.35)health-=.13;
 });

 if(Math.random()<.018){
  let f=sphere(.3,0xff6600);f.position.copy(dragon.position);f.position.y=1.7;
  const dir=new THREE.Vector3().subVectors(player.position,dragon.position).normalize();
  f.userData={vx:dir.x*.27,vz:dir.z*.27,life:120};
  scene.add(f);fireballs.push(f);
 }

 fireballs=fireballs.filter(f=>{
  f.position.x+=f.userData.vx;f.position.z+=f.userData.vz;f.userData.life--;
  if(player.position.distanceTo(f.position)<1){health-=8;scene.remove(f);return false}
  if(f.userData.life<=0){scene.remove(f);return false}
  return true;
 });

 if(health<=0){playing=false;stats.innerText="💀 Game Over"}

 stats.innerText=`❤️ ${Math.floor(health)} | 🍗 ${chicken} | 🐉 ${Math.max(0,dragonHP)} | ⭐ ${score}`;

 camera.position.x=player.position.x;
 camera.position.z=player.position.z+13;
 camera.position.y=7.5;
 camera.lookAt(player.position.x,1.3,player.position.z);
}

function animate(){requestAnimationFrame(animate);update();renderer.render(scene,camera)}
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
