<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Zombies R US</title>
<style>
body{margin:0;background:#090909;color:white;font-family:monospace;text-align:center;overflow:hidden;touch-action:none}
h1{margin:8px 0 2px;color:#ffd84a;font-size:28px;text-shadow:3px 3px #000}
#hud{font-size:15px;margin:3px;color:white}
canvas{image-rendering:pixelated;background:#247c32;border:6px solid #ffd84a;width:96vw;height:62vh}
#ui{position:fixed;bottom:18px;width:100%;display:flex;justify-content:space-around;align-items:center}
#joy{width:145px;height:145px;border-radius:50%;background:#333;border:6px solid #ffd84a;position:relative;touch-action:none}
#knob{width:58px;height:58px;border-radius:50%;background:#ffd84a;position:absolute;left:43px;top:43px}
#attack{width:145px;height:145px;border-radius:50%;background:#c91f1f;color:white;border:6px solid #ffd84a;font-size:25px;font-family:monospace;font-weight:bold;touch-action:none}
#start{padding:10px 22px;border-radius:18px;font-family:monospace;font-weight:bold}
</style>
</head>
<body>

<h1>🧟 Zombies R US 🍗🐉</h1>
<div id="hud">Loading...</div>
<canvas id="game" width="320" height="220"></canvas>

<div id="ui">
  <div id="joy"><div id="knob"></div></div>
  <button id="start">START</button>
  <button id="attack">⚔️ ATTACK</button>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const hud=document.getElementById("hud");
const joy=document.getElementById("joy");
const knob=document.getElementById("knob");
const attackBtn=document.getElementById("attack");

let player,dragon,chickens=[],zombies=[],fireballs=[],particles=[];
let joyX=0,joyY=0,playing=false,score=0;

function newGame(){
  player={x:35,y:110,w:14,h:18,hp:100,chicken:0,cool:0,swing:0,faceX:1,faceY:0};
  dragon={x:260,y:85,w:36,h:36,hp:150,max:150,cool:0};
  chickens=[];zombies=[];fireballs=[];particles=[];
  score=0;playing=true;
  for(let i=0;i<12;i++)addChicken();
  for(let i=0;i<6;i++)addZombie();
}

function addChicken(){
  chickens.push({x:35+Math.random()*220,y:30+Math.random()*155,w:12,h:10});
}

function addZombie(){
  zombies.push({x:90+Math.random()*130,y:30+Math.random()*150,w:14,h:18,s:.32+Math.random()*.23,cool:0});
}

function hit(a,b){
 return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
}

function boom(x,y,color){
 for(let i=0;i<10;i++){
   particles.push({x,y,vx:-1+Math.random()*2,vy:-1+Math.random()*2,life:25,c:color});
 }
}

function attack(){
 if(!playing||player.cool>0)return;

 player.cool=18;
 player.swing=10;

 let swordX=player.x+7+player.faceX*20;
 let swordY=player.y+9+player.faceY*20;

 zombies=zombies.filter(z=>{
   let d=Math.hypot(swordX-(z.x+7),swordY-(z.y+9));
   if(d<22){
     score+=15;
     boom(z.x,z.y,"#b6ff7a");
     return false;
   }
   return true;
 });

 let d=Math.hypot(swordX-(dragon.x+18),swordY-(dragon.y+18));
 if(d<52){
   dragon.hp-=18;
   score+=35;
   boom(dragon.x+18,dragon.y+18,"#ffd84a");
   if(dragon.hp<=0){
     playing=false;
     hud.innerHTML="🏆 VICTORY! You defeated the dragon!";
   }
 }
}

document.getElementById("start").onclick=newGame;

attackBtn.addEventListener("touchstart",e=>{
 e.preventDefault();
 attack();
},{passive:false});

attackBtn.addEventListener("mousedown",e=>{
 e.preventDefault();
 attack();
});

function moveJoy(e){
 e.preventDefault();
 const t=e.touches?e.touches[0]:e;
 const r=joy.getBoundingClientRect();
 const cx=r.left+r.width/2,cy=r.top+r.height/2;
 let dx=t.clientX-cx,dy=t.clientY-cy;
 let dist=Math.min(48,Math.hypot(dx,dy));
 let ang=Math.atan2(dy,dx);
 joyX=Math.cos(ang)*(dist/48);
 joyY=Math.sin(ang)*(dist/48);
 knob.style.left=(43+joyX*43)+"px";
 knob.style.top=(43+joyY*43)+"px";
}

function stopJoy(){
 joyX=0;joyY=0;
 knob.style.left="43px";
 knob.style.top="43px";
}

joy.addEventListener("touchstart",moveJoy,{passive:false});
joy.addEventListener("touchmove",moveJoy,{passive:false});
joy.addEventListener("touchend",stopJoy,{passive:false});

function update(){
 if(!playing)return;

 if(player.cool>0)player.cool--;
 if(player.swing>0)player.swing--;
 if(dragon.cool>0)dragon.cool--;

 player.x+=joyX*1.8;
 player.y+=joyY*1.8;

 if(Math.abs(joyX)>.1||Math.abs(joyY)>.1){
   player.faceX=joyX;
   player.faceY=joyY;
 }

 player.x=Math.max(5,Math.min(300,player.x));
 player.y=Math.max(22,Math.min(198,player.y));

 chickens=chickens.filter(c=>{
   if(hit(player,c)){
     player.chicken++;
     score+=10;
     boom(c.x,c.y,"#fff06a");
     if(chickens.length<8)addChicken();
     return false;
   }
   return true;
 });

 zombies.forEach(z=>{
   let a=Math.atan2(player.y-z.y,player.x-z.x);
   z.x+=Math.cos(a)*z.s;
   z.y+=Math.sin(a)*z.s;
   if(z.cool>0)z.cool--;
   if(hit(player,z)&&z.cool<=0){
     player.hp-=6;
     z.cool=35;
     boom(player.x,player.y,"#ff3333");
   }
 });

 if(dragon.cool<=0){
   let a=Math.atan2(player.y-dragon.y,player.x-dragon.x);
   fireballs.push({x:dragon.x+12,y:dragon.y+12,w:8,h:8,vx:Math.cos(a)*1.55,vy:Math.sin(a)*1.55,life:95});
   dragon.cool=70;
 }

 fireballs=fireballs.filter(f=>{
   f.x+=f.vx;f.y+=f.vy;f.life--;
   if(hit(player,f)){
     player.hp-=10;
     boom(f.x,f.y,"#ff7a00");
     return false;
   }
   return f.life>0;
 });

 particles=particles.filter(p=>{
   p.x+=p.vx;p.y+=p.vy;p.life--;
   return p.life>0;
 });

 if(player.hp<=0){
   player.hp=0;
   playing=false;
   hud.innerHTML="💀 GAME OVER — Tap START to retry";
 }else{
   hud.innerHTML=`❤️ ${Math.floor(player.hp)} | 🍗 ${player.chicken} | 🐉 ${Math.max(0,dragon.hp)} | ⭐ ${score}`;
 }
}

function grass(){
 for(let y=0;y<220;y+=16){
   for(let x=0;x<320;x+=16){
     ctx.fillStyle=((x+y)/16)%2===0?"#2d8a35":"#26752e";
     ctx.fillRect(x,y,16,16);
   }
 }
 ctx.fillStyle="#174d22";
 for(let i=0;i<26;i++)ctx.fillRect((i*41)%318,18+(i*29)%190,8,18);
}

function playerSprite(x,y){
 ctx.fillStyle="#5ee6ff";ctx.fillRect(x+3,y+6,8,9);
 ctx.fillStyle="#b6e8b8";ctx.fillRect(x+4,y,7,6);
 ctx.fillStyle="#143";ctx.fillRect(x+2,y+1,10,2);
 ctx.fillStyle="#113";ctx.fillRect(x+1,y+14,4,5);ctx.fillRect(x+9,y+14,4,5);
 ctx.fillStyle="#000";ctx.fillRect(x+5,y+2,1,1);ctx.fillRect(x+9,y+2,1,1);
}

function zombieSprite(x,y){
 ctx.fillStyle="#8fce7a";ctx.fillRect(x+4,y,7,6);
 ctx.fillStyle="#4c8f48";ctx.fillRect(x+2,y+6,10,8);
 ctx.fillStyle="#2a3";ctx.fillRect(x+1,y+14,4,5);ctx.fillRect(x+9,y+14,4,5);
 ctx.fillStyle="#000";ctx.fillRect(x+5,y+2,1,1);ctx.fillRect(x+9,y+2,1,1);
 ctx.fillStyle="#fff";ctx.fillRect(x+6,y+5,4,1);
}

function chickenSprite(x,y){
 ctx.fillStyle="#d9822b";ctx.fillRect(x+3,y+3,7,5);
 ctx.fillStyle="#f6c36a";ctx.fillRect(x+7,y,4,4);
 ctx.fillStyle="#eee";ctx.fillRect(x,y+5,4,2);
 ctx.fillStyle="#fff";ctx.fillRect(x-1,y+5,2,1);
}

function dragonSprite(x,y){
 ctx.fillStyle="#841818";ctx.fillRect(x,y+12,28,16);
 ctx.fillStyle="#b82020";ctx.fillRect(x+18,y+2,15,14);
 ctx.fillStyle="#f7d14a";ctx.fillRect(x+30,y+5,5,3);
 ctx.fillStyle="#5b0b0b";ctx.fillRect(x+4,y+26,6,8);ctx.fillRect(x+20,y+26,6,8);
 ctx.fillStyle="#6e1111";ctx.fillRect(x-7,y+15,8,5);
 ctx.fillStyle="#ffcc33";ctx.fillRect(x+21,y,3,3);
}

function swordSprite(){
 if(player.swing<=0)return;

 ctx.strokeStyle="#e8e8e8";
 ctx.lineWidth=3;
 ctx.beginPath();
 ctx.moveTo(player.x+7,player.y+9);
 ctx.lineTo(player.x+7+player.faceX*23,player.y+9+player.faceY*23);
 ctx.stroke();

 ctx.fillStyle="#ffd84a";
 ctx.fillRect(player.x+5+player.faceX*11,player.y+7+player.faceY*11,5,5);
}

function draw(){
 grass();

 ctx.fillStyle="rgba(0,0,0,.25)";
 ctx.fillRect(0,0,320,18);

 chickens.forEach(c=>chickenSprite(c.x,c.y));

 fireballs.forEach(f=>{
   ctx.fillStyle="#ff6a00";
   ctx.fillRect(f.x,f.y,8,8);
   ctx.fillStyle="#ffd84a";
   ctx.fillRect(f.x+2,f.y+2,3,3);
 });

 zombies.forEach(z=>zombieSprite(z.x,z.y));
 dragonSprite(dragon.x,dragon.y);
 playerSprite(player.x,player.y);
 swordSprite();

 particles.forEach(p=>{
   ctx.fillStyle=p.c;
   ctx.fillRect(p.x,p.y,3,3);
 });

 ctx.fillStyle="#4d0b0b";
 ctx.fillRect(200,5,100,7);
 ctx.fillStyle="#e53939";
 ctx.fillRect(200,5,100*(dragon.hp/dragon.max),7);
 ctx.strokeStyle="#fff";
 ctx.strokeRect(200,5,100,7);

 if(!playing){
   ctx.fillStyle="rgba(0,0,0,.68)";
   ctx.fillRect(35,58,250,100);
   ctx.strokeStyle="#ffd84a";
   ctx.strokeRect(35,58,250,100);
   ctx.fillStyle="#ffd84a";
   ctx.font="18px monospace";
   ctx.fillText("ZOMBIES R US",86,95);
   ctx.fillStyle="#fff";
   ctx.font="12px monospace";
   ctx.fillText("Left thumb moves",104,122);
   ctx.fillText("Right thumb swings sword",78,140);
 }
}

function loop(){
 update();
 draw();
 requestAnimationFrame(loop);
}

newGame();
loop();
</script>
</body>
</html>
