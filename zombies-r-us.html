<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Zombies R US</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(circle at top, #263b28, #0b0f0c 70%);
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    text-align: center;
    overflow-x: hidden;
  }
  h1 { margin: 14px 0 5px; font-size: 38px; }
  .subtitle { margin: 0 0 10px; color: #f9d56e; }
  #wrap { display: inline-block; position: relative; }
  canvas {
    background: linear-gradient(#315f34, #19361f);
    border: 5px solid #f2d17b;
    border-radius: 12px;
    max-width: 96vw;
    box-shadow: 0 0 25px rgba(0,0,0,.65);
  }
  #panel {
    margin: 8px auto 16px;
    max-width: 820px;
    padding: 10px 14px;
    border-radius: 10px;
    background: rgba(0,0,0,.35);
    line-height: 1.45;
  }
  kbd {
    background: #222;
    border: 1px solid #777;
    border-radius: 4px;
    padding: 2px 6px;
  }
  .btn {
    display: inline-block;
    padding: 8px 12px;
    margin-top: 6px;
    border: 1px solid #f2d17b;
    border-radius: 8px;
    background: #442b12;
    color: #fff;
  }
</style>
</head>
<body>
  <h1>🧟 Zombies R US 🍗</h1>
  <p class="subtitle">Zombie chefs. Fried chicken. Wilderness survival. One angry dragon.</p>
  <div id="wrap">
    <canvas id="game" width="850" height="520"></canvas>
  </div>
  <div id="panel">
    <strong>Controls:</strong> Move with <kbd>Arrow Keys</kbd> or <kbd>WASD</kbd>. Collect 🍗 chicken. Press <kbd>Space</kbd> near the dragon to throw fried chicken power.<br>
    <span class="btn">Goal: collect chicken, survive zombies, defeat the dragon 🐉</span>
  </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const W = canvas.width;
const H = canvas.height;
const keys = {};

 let touchUp = false;
let touchDown = false;
let touchLeft = false;
let touchRight = false;
let touchAttack = false;
let state = 'title';
let message = '';
let frame = 0;

const player = {
  x: 70, y: 260, size: 34, speed: 4.2,
  health: 100, chicken: 0, attackCooldown: 0
};

const dragon = {
  x: 730, y: 225, size: 74, health: 120, maxHealth: 120, fireCooldown: 0
};

let chickens = [];
let zombies = [];
let fireballs = [];
let particles = [];
let score = 0;

function resetGame() {
  state = 'playing';
  message = '';
  frame = 0;
  Object.assign(player, { x: 70, y: 260, health: 100, chicken: 0, attackCooldown: 0 });
  Object.assign(dragon, { x: 730, y: 225, health: 120, fireCooldown: 0 });
  chickens = [];
  zombies = [];
  fireballs = [];
  particles = [];
  score = 0;

  for (let i = 0; i < 12; i++) spawnChicken();
  for (let i = 0; i < 6; i++) spawnZombie(i);
}

function spawnChicken() {
  chickens.push({
    x: 100 + Math.random() * 560,
    y: 70 + Math.random() * 380,
    size: 28,
    wobble: Math.random() * Math.PI * 2
  });
}

function spawnZombie(i) {
  zombies.push({
    x: 220 + Math.random() * 390,
    y: 60 + Math.random() * 390,
    size: 36,
    speed: 0.75 + Math.random() * 0.65,
    biteCooldown: 0,
    name: i
  });
}

window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key === ' ') keys[' '] = true;
  if ((state === 'title' || state === 'gameover' || state === 'win') && (e.key === 'Enter' || e.key === ' ')) {
    resetGame();
  }
});
window.addEventListener('keyup', e => {
  keys[e.key.toLowerCase()] = false;
  if (e.key === ' ') keys[' '] = false;
});

function rectsTouch(a, b) {
  return a.x < b.x + b.size && a.x + a.size > b.x && a.y < b.y + b.size && a.y + a.size > b.y;
}

function distance(a, b) {
  const ax = a.x + a.size / 2;
  const ay = a.y + a.size / 2;
  const bx = b.x + b.size / 2;
  const by = b.y + b.size / 2;
  return Math.hypot(ax - bx, ay - by);
}

function addParticles(x, y, emoji, count = 8) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y, emoji,
      vx: -2 + Math.random() * 4,
      vy: -3 + Math.random() * 2,
      life: 35 + Math.random() * 20
    });
  }
}

function update() {
  if (state !== 'playing') return;
  frame++;
  if (player.attackCooldown > 0) player.attackCooldown--;
  if (dragon.fireCooldown > 0) dragon.fireCooldown--;

  let dx = 0, dy = 0;
  if (keys['arrowup'] || keys['w'] || touchUp) dy -= 1;
if (keys['arrowdown'] || keys['s'] || touchDown) dy += 1;
if (keys['arrowleft'] || keys['a'] || touchLeft) dx -= 1;
if (keys['arrowright'] || keys['d'] || touchRight) dx += 1;
 
    const mag = Math.hypot(dx, dy);
    player.x += (dx / mag) * player.speed;
    player.y += (dy / mag) * player.speed;
  }
  player.x = Math.max(12, Math.min(W - player.size - 12, player.x));
  player.y = Math.max(55, Math.min(H - player.size - 18, player.y));

  chickens = chickens.filter(c => {
    c.wobble += 0.08;
    if (rectsTouch(player, c)) {
      player.chicken++;
      score += 10;
      addParticles(c.x, c.y, '✨', 6);
      if (chickens.length < 7) spawnChicken();
      return false;
    }
    return true;
  });

  zombies.forEach(z => {
    const angle = Math.atan2(player.y - z.y, player.x - z.x);
    z.x += Math.cos(angle) * z.speed;
    z.y += Math.sin(angle) * z.speed;
    z.biteCooldown = Math.max(0, z.biteCooldown - 1);
    if (rectsTouch(player, z) && z.biteCooldown === 0) {
      player.health -= 8;
      z.biteCooldown = 45;
      addParticles(player.x, player.y, '💥', 4);
    }
  });

  if (dragon.fireCooldown === 0) {
    const angle = Math.atan2(player.y - dragon.y, player.x - dragon.x);
    fireballs.push({
      x: dragon.x + 20, y: dragon.y + 40,
      size: 24,
      vx: Math.cos(angle) * 4.2,
      vy: Math.sin(angle) * 4.2,
      life: 130
    });
    dragon.fireCooldown = 85;
  }

  fireballs = fireballs.filter(f => {
    f.x += f.vx;
    f.y += f.vy;
    f.life--;
    if (rectsTouch(player, f)) {
      player.health -= 14;
      addParticles(f.x, f.y, '🔥', 8);
      return false;
    }
    return f.life > 0 && f.x > -50 && f.x < W + 50 && f.y > -50 && f.y < H + 50;
  });

  if (keys[' '] && player.attackCooldown === 0 && player.chicken >= 1 && distance(player, dragon) < 135) {
    player.chicken -= 1;
    dragon.health -= 15;
    score += 25;
    player.attackCooldown = 32;
    addParticles(dragon.x, dragon.y, '🍗', 12);
  }

  particles = particles.filter(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.08;
    p.life--;
    return p.life > 0;
  });

  if (player.health <= 0) {
    player.health = 0;
    state = 'gameover';
    message = 'The wilderness got you. The dragon stole the secret chicken recipe.';
  }
  if (dragon.health <= 0) {
    dragon.health = 0;
    state = 'win';
    message = 'You defeated the dragon and saved fried chicken for zombie-kind!';
  }
}

function drawForest() {
  ctx.fillStyle = '#1f4828';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#19351f';
  for (let i = 0; i < 30; i++) {
    const x = (i * 97 + 40) % W;
    const y = 58 + ((i * 73) % 420);
    ctx.font = '28px Arial';
    ctx.fillText('🌲', x, y);
  }
  ctx.fillStyle = 'rgba(0,0,0,.2)';
  ctx.fillRect(0, 0, W, 48);
}

function drawHUD() {
  ctx.font = '18px Arial';
  ctx.fillStyle = '#fff';
  ctx.fillText(`❤️ Health: ${Math.ceil(player.health)}`, 18, 30);
  ctx.fillText(`🍗 Chicken: ${Math.floor(player.chicken)}`, 170, 30);
  ctx.fillText(`⭐ Score: ${score}`, 325, 30);

  ctx.fillStyle = '#450909';
  ctx.fillRect(560, 15, 250, 18);
  ctx.fillStyle = '#e04b3f';
  ctx.fillRect(560, 15, 250 * (dragon.health / dragon.maxHealth), 18);
  ctx.strokeStyle = '#fff';
  ctx.strokeRect(560, 15, 250, 18);
  ctx.fillStyle = '#fff';
  ctx.fillText('🐉 Dragon', 465, 30);
}

function draw() {
  drawForest();

  ctx.font = '30px Arial';
  chickens.forEach(c => ctx.fillText('🍗', c.x, c.y + Math.sin(c.wobble) * 4));

  ctx.font = '38px Arial';
  zombies.forEach(z => ctx.fillText('🧟‍♂️', z.x, z.y));

  ctx.font = '72px Arial';
  ctx.fillText('🐉', dragon.x, dragon.y + 65);

  ctx.font = '34px Arial';
  ctx.fillText('🧟‍♀️', player.x, player.y + 34);

  ctx.font = '28px Arial';
  fireballs.forEach(f => ctx.fillText('🔥', f.x, f.y));

  particles.forEach(p => {
    ctx.font = '20px Arial';
    ctx.fillText(p.emoji, p.x, p.y);
  });

  drawHUD();

  if (state === 'title') drawOverlay('Zombies R US', 'Press ENTER or SPACE to start', 'Collect chicken, dodge zombies, and defeat the dragon.');
  if (state === 'gameover') drawOverlay('Game Over 💀', 'Press ENTER or SPACE to try again', message);
  if (state === 'win') drawOverlay('Victory 🏆', 'Press ENTER or SPACE to play again', message);
}

function drawOverlay(title, action, sub) {
  ctx.fillStyle = 'rgba(0,0,0,.68)';
  ctx.fillRect(70, 105, W - 140, 300);
  ctx.strokeStyle = '#f2d17b';
  ctx.lineWidth = 3;
  ctx.strokeRect(70, 105, W - 140, 300);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.font = '48px Arial';
  ctx.fillText(title, W / 2, 175);
  ctx.font = '23px Arial';
  ctx.fillStyle = '#f9d56e';
  ctx.fillText(sub, W / 2, 238);
  ctx.fillStyle = '#fff';
  ctx.fillText(action, W / 2, 315);
  ctx.font = '19px Arial';
  ctx.fillText('Arrow Keys / WASD = move   |   SPACE near dragon = attack', W / 2, 360);
  ctx.textAlign = 'left';
}

canvas.addEventListener('touchstart', e => {
  e.preventDefault();

  if (state === 'title' || state === 'gameover' || state === 'win') {
    resetGame();
    return;
  }

  const t = e.touches[0];
  const rect = canvas.getBoundingClientRect();
  const x = t.clientX - rect.left;
  const y = t.clientY - rect.top;
  const cw = rect.width;
  const ch = rect.height;

  touchUp = y < ch * 0.35;
  touchDown = y > ch * 0.65;
  touchLeft = x < cw * 0.35;
  touchRight = x > cw * 0.65;

  if (x > cw * 0.68 && y > ch * 0.55) {
    touchAttack = true;
  }
}, { passive: false });

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  touchUp = false;
  touchDown = false;
  touchLeft = false;
  touchRight = false;
  touchAttack = false;
}, { passive: false });
 
</script>
</body>
</html>
